# =============================================================================
# Dutchkem Trading AI — Render Blueprint (Free Tier)
# =============================================================================
# Services:
#   1. Web Service       — Django API + Gunicorn
#   2. Background Worker  — Celery Worker (async tasks)
#   3. Cron Job           — Celery Beat (scheduled tasks)
#
# External (managed separately):
#   - Supabase  → PostgreSQL DATABASE_URL
#   - Upstash   → Redis REDIS_URL
#   - Vercel    → React frontend
#   - Cloudflare → MCP bridge tunnel
#
# Deploy: render blueprint apply (or push to GitHub with auto-deploy)
# =============================================================================

services:
  # ── 1. Django Web Service ─────────────────────────────────────────
  - type: web
    name: dutchkem-api
    runtime: python
    plan: free
    buildCommand: >-
      cd dutchkem-trading-ai/backend &&
      pip install --upgrade pip setuptools wheel &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: >-
      cd dutchkem-trading-ai/backend &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 2
      --threads 4
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health/
    healthCheckPolicy:
      responseTimeoutMs: 30000
      failureThreshold: 3
      successThreshold: 2
    autoDeploy: true
    envVars:
      # ── Django Core ──
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # ── Database (Supabase) ──
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      # ── Redis (Upstash — set manually after Upstash setup) ──
      - key: REDIS_URL
        sync: false
      # ── CORS / CSRF ──
      - key: CORS_ALLOWED_ORIGINS
        value: https://dutchkem-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://dutchkem-frontend.vercel.app
      # ── MetaTrader 5 MCP Bridge ──
      - key: MT5_HOST
        value: 127.0.0.1
      - key: MT5_PORT
        value: "8082"
      - key: MT5_WS_PORT
        value: "8081"
      - key: MT5_MCP_URL
        value: http://localhost:8082
      # ── Security Headers ──
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_PROXY_SSL_HEADER
        value: "('HTTP_X_FORWARDED_PROTO', 'https')"
      # ── Celery (broker = same Upstash Redis) ──
      - key: CELERY_BROKER_URL
        sync: false
    tags:
      - name: dutchkem
        value: backend

  # ── 2. Celery Worker (Background Tasks) ──────────────────────────
  - type: worker
    name: dutchkem-celery-worker
    runtime: python
    plan: free
    buildCommand: >-
      cd dutchkem-trading-ai/backend &&
      pip install -r requirements.txt
    startCommand: >-
      cd dutchkem-trading-ai/backend &&
      celery -A config worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=100
      --max-memory-per-child=256000
      --without-heartbeat
      --without-mingle
      -Q default,celery,signals,trading,ml
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: SECRET_KEY
        fromService:
          name: dutchkem-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: MT5_HOST
        value: 127.0.0.1
      - key: MT5_PORT
        value: "8082"
    tags:
      - name: dutchkem
        value: worker

  # ── 3. Celery Beat (Scheduled Tasks) ─────────────────────────────
  - type: cron
    name: dutchkem-celery-beat
    runtime: python
    plan: free
    buildCommand: >-
      cd dutchkem-trading-ai/backend &&
      pip install -r requirements.txt
    startCommand: >-
      cd dutchkem-trading-ai/backend &&
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    schedule: "0 */6 * * *"  # Runs every 6 hours (beat manages its own schedule internally)
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: SECRET_KEY
        fromService:
          name: dutchkem-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false

# ── Database (Render-managed PostgreSQL — fallback if Supabase unavailable) ──
# NOTE: Primary database is Supabase. This is a Render-managed fallback.
# To use Supabase, set DATABASE_URL env var manually to your Supabase connection string.
databases:
  - name: dutchkem-db
    plan: free
    databaseName: dutchkem_trading
    ipAllowList: []
