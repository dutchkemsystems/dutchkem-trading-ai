version: '3.8'

services:
  # ============================================
  # SYNX-MT5-MCP Server
  # Bridges MetaTrader 5 to the Dutchkem backend
  # ============================================
  synx-mt5:
    image: ghcr.io/synx-mt5/synx-mt5-mcp:latest
    container_name: synx-mt5-mcp
    ports:
      - "8080:8080"
    environment:
      - MT5_HOST=host.docker.internal
      - MT5_PORT=3000
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mt5-network

  # ============================================
  # Cloudflare Tunnel
  # Exposes the MCP server securely to the internet
  # ============================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      synx-mt5:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mt5-network

networks:
  mt5-network:
    driver: bridge
