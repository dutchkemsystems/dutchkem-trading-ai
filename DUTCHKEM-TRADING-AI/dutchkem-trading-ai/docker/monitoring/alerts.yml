groups:
  - name: dutchkem-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} requests/sec"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is {{ $value }}s"

      - alert: DrawdownExceeded
        expr: trading_drawdown_percent > 15
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Max drawdown exceeded"
          description: "Drawdown is {{ $value }}% (limit: 15%)"

      - alert: DailyLossLimit
        expr: abs(trading_daily_pnl_percent) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Daily loss limit reached"
          description: "Daily loss is {{ $value }}% (limit: 2%)"

      - alert: MT5Disconnected
        expr: trading_mt5_connected == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MT5 connection lost"
          description: "MT5 is disconnected"

      - alert: InfluxDBDown
        expr: up{job="influxdb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "InfluxDB is down"
          description: "InfluxDB instance is unreachable"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance is unreachable"

      - alert: CircuitBreakerTriggered
        expr: trading_circuit_breaker_active == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker triggered"
          description: "Trading has been stopped due to risk limits"

      - alert: PaymentWebhookFailed
        expr: rate(payment_webhook_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Payment webhook failures"
          description: "Payment webhook error rate is {{ $value }}/sec"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 10%"

      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / process_virtual_memory_max_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90%"
