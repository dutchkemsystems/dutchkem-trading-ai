global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@dutchkem.com'
  smtp_require_tls: false

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'web.hook'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://backend:8000/api/v1/webhooks/alerts/'
