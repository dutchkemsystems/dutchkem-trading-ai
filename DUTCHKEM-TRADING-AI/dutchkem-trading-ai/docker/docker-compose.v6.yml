version: '3.8'

# Dutchkem Trading AI — V6 Complete Docker Compose
# Includes ALL services: Postgres/TimescaleDB, Redis, RabbitMQ, InfluxDB,
# Backend, Celery Worker, Celery Beat, and Nginx

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dutchkem-postgres-v6
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-dutchkem_trading}
      POSTGRES_USER: ${DB_USER:-dutchkem_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dutchkem_admin} -d ${DB_NAME:-dutchkem_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dutchkem-redis-v6
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dutchkem-rabbitmq-v6
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dutchkem}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: dutchkem-influxdb-v6
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-admin123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-dutchkem}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-trading_data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-supersecrettoken}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: dutchkem-backend-v6
    restart: always
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-supersecrettoken}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-dutchkem}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-trading_data}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - MT5_HOST=${MT5_HOST:-127.0.0.1}
      - MT5_PORT=${MT5_PORT:-8080}
      - MT5_WS_PORT=${MT5_WS_PORT:-8081}
      - MT5_TIMEOUT=${MT5_TIMEOUT:-10}
      - MT5_MAX_RETRIES=${MT5_MAX_RETRIES:-5}
      - MT5_RETRY_DELAY=${MT5_RETRY_DELAY:-2.0}
      # V6 Trading System
      - V6_TRADING_CYCLE_ENABLED=${V6_TRADING_CYCLE_ENABLED:-True}
      - META_LEARNING_ENABLED=${META_LEARNING_ENABLED:-True}
      - ASSET_ENSEMBLE_ENABLED=${ASSET_ENSEMBLE_ENABLED:-True}
      - TRANSFER_LEARNING_ENABLED=${TRANSFER_LEARNING_ENABLED:-True}
      - DYNAMIC_ALLOCATION_ENABLED=${DYNAMIC_ALLOCATION_ENABLED:-True}
      - STRATEGY_DIVERSIFICATION_ENABLED=${STRATEGY_DIVERSIFICATION_ENABLED:-True}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - dutchkem-network
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: dutchkem-celery-worker-v6
    restart: always
    command: celery -A config worker -l INFO --concurrency=4
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-supersecrettoken}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-dutchkem}
      - MT5_HOST=${MT5_HOST:-127.0.0.1}
      - MT5_PORT=${MT5_PORT:-8080}
      # V6 Trading System
      - V6_TRADING_CYCLE_ENABLED=${V6_TRADING_CYCLE_ENABLED:-True}
      - META_LEARNING_ENABLED=${META_LEARNING_ENABLED:-True}
      - ASSET_ENSEMBLE_ENABLED=${ASSET_ENSEMBLE_ENABLED:-True}
      - TRANSFER_LEARNING_ENABLED=${TRANSFER_LEARNING_ENABLED:-True}
      - DYNAMIC_ALLOCATION_ENABLED=${DYNAMIC_ALLOCATION_ENABLED:-True}
      - STRATEGY_DIVERSIFICATION_ENABLED=${STRATEGY_DIVERSIFICATION_ENABLED:-True}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dutchkem-network

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: dutchkem-celery-beat-v6
    restart: always
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dutchkem-network

  nginx:
    image: nginx:alpine
    container_name: dutchkem-nginx-v6
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
    networks:
      - dutchkem-network

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  rabbitmq_data:
  static_files:
  media_files:

networks:
  dutchkem-network:
    driver: bridge
