version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: dutchkem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dutchkem_trading}
      POSTGRES_USER: ${DB_USER:-dutchkem_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dutchkem_secure_2024}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dutchkem_admin} -d ${DB_NAME:-dutchkem_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dutchkem-network

  redis:
    image: redis:7-alpine
    container_name: dutchkem_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dutchkem-network

  influxdb:
    image: influxdb:2.7
    container_name: dutchkem_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-dutchkem_influx_2024}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-dutchkem}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-trading_data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-dutchkem-influx-token-dev}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dutchkem-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dutchkem_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dutchkem}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-dutchkem_mq_2024}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dutchkem-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: dutchkem_backend
    restart: unless-stopped
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dutchkem-secret-key-dev-change-in-prod}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem_admin}:${DB_PASSWORD:-dutchkem_secure_2024}@db:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://redis:6379/0
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-dutchkem-influx-token-dev}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-dutchkem}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-trading_data}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-dutchkem_mq_2024}@rabbitmq:5672/
      - MT5_HOST=host.docker.internal
      - MT5_PORT=${MT5_PORT:-3000}
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-dutchkem_mq_2024}@rabbitmq:5672//
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - dutchkem-network

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: dutchkem_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info -c 4
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dutchkem-secret-key-dev-change-in-prod}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem_admin}:${DB_PASSWORD:-dutchkem_secure_2024}@db:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://redis:6379/0
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-dutchkem-influx-token-dev}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-dutchkem}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-dutchkem_mq_2024}@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend:/app
    networks:
      - dutchkem-network

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: dutchkem_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dutchkem-secret-key-dev-change-in-prod}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem_admin}:${DB_PASSWORD:-dutchkem_secure_2024}@db:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-dutchkem}:${RABBITMQ_PASS:-dutchkem_mq_2024}@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend:/app
    networks:
      - dutchkem-network

  nginx:
    image: nginx:alpine
    container_name: dutchkem_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dutchkem-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: dutchkem_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - REACT_APP_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    networks:
      - dutchkem-network

  prometheus:
    image: prom/prometheus:latest
    container_name: dutchkem_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - dutchkem-network

  grafana:
    image: grafana/grafana:latest
    container_name: dutchkem_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - dutchkem-network

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  rabbitmq_data:
  static_volume:
  media_volume:
  prometheus_data:
  grafana_data:

networks:
  dutchkem-network:
    driver: bridge
