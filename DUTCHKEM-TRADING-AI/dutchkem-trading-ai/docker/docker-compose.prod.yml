version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dutchkem-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-dutchkem_trading}
      POSTGRES_USER: ${DB_USER:-dutchkem}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dutchkem} -d ${DB_NAME:-dutchkem_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dutchkem-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: dutchkem-influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-influxsecret}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-dutchkem}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-market_data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-supersecrettoken}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dutchkem-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dutchkem-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: dutchkem-backend
    restart: always
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem}:${DB_PASSWORD:-supersecret}@postgres:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-supersecrettoken}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-dutchkem}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-market_data}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - MT5_HOST=${MT5_HOST:-127.0.0.1}
      - MT5_PORT=${MT5_PORT:-1985}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dutchkem-network
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: dutchkem-celery-worker
    restart: always
    command: celery -A config worker -l INFO --concurrency=4
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem}:${DB_PASSWORD:-supersecret}@postgres:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-supersecrettoken}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-dutchkem}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dutchkem-network

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: dutchkem-celery-beat
    restart: always
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${DB_USER:-dutchkem}:${DB_PASSWORD:-supersecret}@postgres:5432/${DB_NAME:-dutchkem_trading}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - dutchkem-network

  nginx:
    image: nginx:alpine
    container_name: dutchkem-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - backend
    networks:
      - dutchkem-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dutchkem-frontend
    restart: always
    networks:
      - dutchkem-network

  prometheus:
    image: prom/prometheus:latest
    container_name: dutchkem-prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - dutchkem-network

  grafana:
    image: grafana/grafana:latest
    container_name: dutchkem-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - dutchkem-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: dutchkem_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - dutchkem-network

volumes:
  postgres_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  rabbitmq_data:
  static_files:
  media_files:
  prometheus_data:
  grafana_data:

networks:
  dutchkem-network:
    driver: bridge
