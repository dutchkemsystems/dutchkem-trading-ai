app = "dutchkem-trading-ai-frontend"
primary_region = "ams"

[build]
  dockerfile = "dutchkem-trading-ai/frontend/Dockerfile.fly"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
