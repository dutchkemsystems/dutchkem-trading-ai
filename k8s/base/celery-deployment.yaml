apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortress-celery-worker
  namespace: dutchkem
  labels:
    app: fortress-celery
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortress-celery
  template:
    metadata:
      labels:
        app: fortress-celery
    spec:
      containers:
        - name: celery-worker
          image: dutchkem/fortress-api:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "-Q", "metering,billing,topup,fraud"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: database-url
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: celery-broker-url
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortress-celery-beat
  namespace: dutchkem
  labels:
    app: fortress-celery
    component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortress-celery-beat
  template:
    metadata:
      labels:
        app: fortress-celery-beat
    spec:
      containers:
        - name: celery-beat
          image: dutchkem/fortress-api:latest
          command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: celery-broker-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
