apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortress-api
  namespace: dutchkem
  labels:
    app: fortress-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fortress-api
  template:
    metadata:
      labels:
        app: fortress-api
    spec:
      containers:
        - name: api
          image: dutchkem/fortress-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fortress-secrets
                  key: secret-key
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fortress-api
  namespace: dutchkem
spec:
  selector:
    app: fortress-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fortress-api
  namespace: dutchkem
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dutchkem.com
      secretName: fortress-api-tls
  rules:
    - host: api.dutchkem.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fortress-api
                port:
                  number: 80
