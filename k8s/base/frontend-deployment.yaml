apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortress-admin
  namespace: dutchkem
  labels:
    app: fortress-admin
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fortress-admin
  template:
    metadata:
      labels:
        app: fortress-admin
    spec:
      containers:
        - name: frontend
          image: dutchkem/fortress-admin:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fortress-admin
  namespace: dutchkem
spec:
  selector:
    app: fortress-admin
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
