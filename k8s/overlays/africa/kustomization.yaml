apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dutchkem

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: fortress-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Namespace
      name: dutchkem
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: dutchkem
        labels:
          region: africa
          compliance: ndpa

configMapGenerator:
  - name: fortress-config
    literals:
      - REGION=africa
      - COMPLIANCE_REGIME=ndpa
      - DEFAULT_CURRENCY=NGN
      - CLUSTER=aws-cape-town
