# =============================================================================
# Dutchkem Trading AI — Render Deployment Configuration
# =============================================================================
# Updated: 2026-09-01
# 
# IMPORTANT: Variables marked with sync: false MUST be set manually in the
# Render dashboard after deployment. They contain sensitive data.
# =============================================================================

services:
  # ── Django Web Service ──────────────────────────────────────────────────────
  - type: web
    name: dutchkem-trading-ai
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: MT5_HOST
        sync: false
      - key: MT5_PORT
        value: "443"
      - key: MT5_WS_PORT
        value: "443"
      - key: MT5_TIMEOUT
        value: "10"
      - key: MT5_MAX_RETRIES
        value: "5"
      - key: MT5_RETRY_DELAY
        value: "2.0"
      - key: MT5_LOGIN
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_SERVER
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: dutchkem-trading-ai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://dutchkem-trading-ai-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: TRADING_MODE
        value: "full"
      - key: TRADING_ENGINE
        value: "v6.5"
      - key: V65_ENABLED
        value: "true"
    healthCheckPath: /health/
    autoDeploy: true

  # ── Celery Worker (trading cycles, signals, market data) ────────────────────
  - type: worker
    name: dutchkem-celery-worker
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    command: celery -A config.celery worker -l info -Q default,market_data,trading,signals,backtesting --concurrency=4
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: MT5_HOST
        sync: false
      - key: MT5_PORT
        value: "443"
      - key: MT5_WS_PORT
        value: "443"
      - key: MT5_TIMEOUT
        value: "10"
      - key: MT5_MAX_RETRIES
        value: "5"
      - key: MT5_RETRY_DELAY
        value: "2.0"
      - key: MT5_LOGIN
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_SERVER
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: dutchkem-trading-ai.onrender.com
      - key: TRADING_MODE
        value: "full"
      - key: TRADING_ENGINE
        value: "v6.5"
      - key: V65_ENABLED
        value: "true"

  # ── Celery Beat (periodic task scheduler) ───────────────────────────────────
  - type: worker
    name: dutchkem-celery-beat
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: MT5_HOST
        sync: false
      - key: MT5_PORT
        value: "443"
      - key: MT5_WS_PORT
        value: "443"
      - key: MT5_TIMEOUT
        value: "10"
      - key: MT5_MAX_RETRIES
        value: "5"
      - key: MT5_RETRY_DELAY
        value: "2.0"
      - key: MT5_LOGIN
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: MT5_SERVER
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: dutchkem-trading-ai.onrender.com
      - key: TRADING_MODE
        value: "full"
      - key: TRADING_ENGINE
        value: "v6.5"
      - key: V65_ENABLED
        value: "true"

databases:
  - name: dutchkem-db
    plan: free
    databaseName: dutchkem_trading
    ipAllowList: []
