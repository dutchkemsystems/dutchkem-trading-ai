services:
  - type: web
    name: dutchkem-trading-ai
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: USE_SQLITE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dutchkem-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: MT5_HOST
        sync: false
      - key: MT5_PORT
        value: "443"
      - key: MT5_WS_PORT
        value: "443"
      - key: MT5_TIMEOUT
        value: "10"
      - key: MT5_MAX_RETRIES
        value: "5"
      - key: MT5_RETRY_DELAY
        value: "2.0"
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: dutchkem-trading-ai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://dutchkem-trading-ai-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
    healthCheckPath: /health/
    autoDeploy: true

databases:
  - name: dutchkem-db
    plan: free
    databaseName: dutchkem_trading
    ipAllowList: []
