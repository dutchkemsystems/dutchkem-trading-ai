services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dutchkem
      POSTGRES_PASSWORD: dutchkem_trading
      POSTGRES_DB: dutchkem_trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dutchkem -d dutchkem_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - USE_SQLITE=0
      - DATABASE_URL=postgresql://dutchkem:dutchkem_trading@db:5432/dutchkem_trading
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MT5_HOST=host.docker.internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - staticfiles:/app/backend/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config.celery worker -l info -Q default,market_data,trading,signals,backtesting
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - USE_SQLITE=0
      - DATABASE_URL=postgresql://dutchkem:dutchkem_trading@db:5432/dutchkem_trading
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MT5_HOST=host.docker.internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - USE_SQLITE=0
      - DATABASE_URL=postgresql://dutchkem:dutchkem_trading@db:5432/dutchkem_trading
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  staticfiles:
