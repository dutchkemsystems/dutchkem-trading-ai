# =============================================================================
# Dutchkem Trading AI — Full Stack Docker Compose
# =============================================================================
# Includes ALL services: PostgreSQL, Redis, MT5 Bridge, Django, Celery Worker,
# Celery Beat. Use for local production testing.
#
# Usage:
#   docker compose -f docker-compose.full.yml up -d
#   docker compose -f docker-compose.full.yml down
# =============================================================================

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dutchkem-db
    environment:
      POSTGRES_USER: dutchkem
      POSTGRES_PASSWORD: dutchkem_trading
      POSTGRES_DB: dutchkem_trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dutchkem -d dutchkem_trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dutchkem-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MT5 Bridge (SYNX-MT5-MCP) ─────────────────────────────────────────────
  mt5-bridge:
    image: ghcr.io/synx-ai/synx-mt5-mcp:latest
    container_name: dutchkem-mt5-bridge
    ports:
      - "8082:8082"   # REST API
      - "8081:8081"   # WebSocket
    env_file: mt5-bridge/.env
    environment:
      - MT5_HOST=host.docker.internal
      - MT5_PORT=${MT5_MT5_PORT:-1929}
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mt5-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Django Backend ──────────────────────────────────────────────────────────
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dutchkem-django
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - USE_SQLITE=0
      - DATABASE_URL=postgresql://dutchkem:dutchkem_trading@db:5432/dutchkem_trading
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MT5_HOST=host.docker.internal
      - MT5_PORT=8082
      - MT5_WS_PORT=8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - staticfiles:/app/backend/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dutchkem-celery-worker
    command: celery -A config.celery worker -l info -Q default,market_data,trading,signals,backtesting --concurrency=4
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - USE_SQLITE=0
      - DATABASE_URL=postgresql://dutchkem:dutchkem_trading@db:5432/dutchkem_trading
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MT5_HOST=host.docker.internal
      - MT5_PORT=8082
      - MT5_WS_PORT=8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat (periodic task scheduler) ───────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dutchkem-celery-beat
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_production
      - USE_SQLITE=0
      - DATABASE_URL=postgresql://dutchkem:dutchkem_trading@db:5432/dutchkem_trading
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
  mt5-data:
