app = "dutchkem-trading-ai"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings_production"
  DEBUG = "0"
  USE_SQLITE = "0"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
