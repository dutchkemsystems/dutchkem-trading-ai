version: '3.8'
services:
  mt5-bridge:
    image: synx/mt5-mcp:latest
    container_name: dutchkem-mt5-bridge
    ports:
      - "8082:3000"
      - "8081:3001"
    environment:
      - MT5_HOST=host.docker.internal
      - MT5_PORT=443
      - LOG_LEVEL=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
